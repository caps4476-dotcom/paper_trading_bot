name: Paper Trading Bot

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}   # "Run workflow"-Button zum manuellen Starten

permissions:
  contents: write   # nötig, um paper_state.json zurück ins Repo zu speichern

# Nie zwei Läufe gleichzeitig – sonst könnte ein Trade doppelt gezählt werden
concurrency:
  group: paper-bot
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Repo auschecken
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Abhängigkeiten installieren
        run: pip install -r requirements.txt

      - name: Bot ausführen
        env:
          PAPER_BOT_TOKEN: ${{ secrets.PAPER_BOT_TOKEN }}
          OWNER_CHAT_ID: ${{ secrets.OWNER_CHAT_ID }}
          SIGNAL_CHANNEL_ID: ${{ secrets.SIGNAL_CHANNEL_ID }}
        run: python paper_bot.py

      - name: Kontostand speichern
        run: |
          if [ -n "$(git status --porcelain paper_state.json)" ]; then
            git config user.name "paper-bot"
            git config user.email "actions@github.com"
            git add paper_state.json
            git commit -m "Paper-Konto aktualisiert [skip ci]"
            git push || (git pull --rebase && git push)
          fi
